<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Matt Grofsky, D.Eng., CISSP. AI/ML and Cybersecurity Strategist. Chief Information Security Officer, Sharpen Technologies. Secure by Design.">
  <defs>
    <style>
      .name { font: 700 46px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f2b705; letter-spacing: .5px; }
      .sub  { font: 500 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f7f7f8; letter-spacing: .8px; }
      .role { font: 400 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #b9b9c2; }
      .chip { font: 700 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f7f7f8; letter-spacing: 4px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="#0d1117" fill-opacity="0"/>
  <rect x="6" y="6" width="1188" height="288" rx="26" fill="#1b1b1d" stroke="#c9257d" stroke-width="2"/>

  <!-- circuit traces -->
  <g stroke="#3a3a40" stroke-width="1.5" fill="none">
    <path d="M40 44 H150 L175 68 H235"/>
    <path d="M420 262 H510 L530 282 H590"/>
  </g>
  <circle cx="235" cy="68" r="3.5" fill="#c9257d"/>
  <circle cx="150" cy="44" r="2.5" fill="#3a3a40"/>
  <circle cx="590" cy="282" r="3.5" fill="#f2b705"/>
  <circle cx="510" cy="262" r="2.5" fill="#3a3a40"/>

  <!-- text block -->
  <rect x="70" y="86" width="36" height="5" rx="2.5" fill="#f2b705"/>
  <text x="70" y="145" class="name">Matt Grofsky, D.Eng., CISSP</text>
  <text x="70" y="182" class="sub">AI/ML &amp; Cybersecurity Strategist</text>
  <text x="70" y="216" class="role">Chief Information Security Officer, Sharpen Technologies</text>
  <text x="70" y="240" class="role">Adjunct Professor &amp; Doctoral Advisor, The George Washington University</text>

  <!-- emblem -->
  <g transform="translate(1030,118)">
    <circle r="52" stroke="#f2b705" stroke-width="2.5" fill="none"/>
    <g stroke="#5a5a62" stroke-width="2">
      <line x1="0" y1="-74" x2="0" y2="-58"/><line x1="0" y1="58" x2="0" y2="74"/>
      <line x1="-74" y1="0" x2="-58" y2="0"/><line x1="58" y1="0" x2="74" y2="0"/>
      <line x1="-53" y1="-53" x2="-41" y2="-41"/><line x1="41" y1="41" x2="53" y2="53"/>
      <line x1="-53" y1="53" x2="-41" y2="41"/><line x1="41" y1="-41" x2="53" y2="-53"/>
    </g>
    <circle cx="0" cy="-76" r="4" fill="#c9257d"/>
    <circle cx="76" cy="0" r="4" fill="#f2b705"/>
    <circle cx="-76" cy="0" r="4" fill="#5a5a62"/>
    <circle cx="0" cy="76" r="4" fill="#5a5a62"/>
    <circle cx="-55" cy="55" r="3.5" fill="#c9257d"/>
    <circle cx="55" cy="55" r="3.5" fill="#f2b705"/>
    <circle cx="-55" cy="-55" r="3.5" fill="#5a5a62"/>
    <circle cx="55" cy="-55" r="3.5" fill="#5a5a62"/>
    <path d="M0 -32c9 6 18 8 26 8 0 26 -8 40 -26 50 -18 -10 -26 -24 -26 -50 8 0 17 -2 26 -8z" fill="#f2b705"/>
    <path d="M0 -22c6 4 12 5.5 17 5.7 0 18 -5.5 28 -17 35 -11.5 -7 -17 -17 -17 -35 5 -.2 11 -1.7 17 -5.7z" fill="#1b1b1d" opacity=".18"/>
  </g>

  <!-- chip -->
  <rect x="930" y="216" width="200" height="36" rx="8" fill="#232326" stroke="#333338"/>
  <text x="1030" y="239" text-anchor="middle" class="chip">SECURE BY DESIGN</text>
</svg>
