<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 6" width="900" height="6">
  <style>
    .pulse { animation: slide 11s linear infinite; }
    @keyframes slide {
      0% { transform: translateX(-150px); }
      45% { transform: translateX(900px); }
      100% { transform: translateX(900px); }
    }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 0; } }
  </style>
  <rect y="2.5" width="900" height="1" fill="#333338"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2b705" stop-opacity="0"/>
      <stop offset=".45" stop-color="#f2b705"/>
      <stop offset=".55" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#f2b705" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect class="pulse" y="2" width="150" height="2" rx="1" fill="url(#g)"/>
</svg>
